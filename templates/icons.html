{% macro icon(name, class_name='') -%}
<svg class="icon {{ class_name }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{% if name == 'orbit' %}<circle cx="12" cy="12" r="5"/><ellipse cx="12" cy="12" rx="11" ry="4.5" transform="rotate(-35 12 12)"/><circle cx="20" cy="6" r="1.4" fill="currentColor" stroke="none"/>
{% elif name == 'search' %}<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5M10.5 7v7M7 10.5h7"/>
{% elif name == 'signal' %}<path d="M2 12h5l3-7 4 14 3-7h5"/>
{% elif name == 'chart' %}<path d="M4 3v17h17M8 15v-4m5 4V7m5 8V4"/>
{% elif name == 'arrow' %}<path d="M4 12h16m-6-6 6 6-6 6"/>
{% elif name == 'arrow-up' %}<path d="M12 20V4m-6 6 6-6 6 6"/>
{% elif name == 'down' %}<path d="M12 4v16m-5-5 5 5 5-5"/>
{% elif name == 'menu' %}<path d="M4 8h16M4 16h16"/>
{% elif name == 'close' %}<path d="m6 6 12 12M6 18 18 6"/>
{% elif name == 'spark' %}<path d="m12 2 2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5Z"/>
{% elif name == 'tree' %}<path d="M12 3v6M5 14v-5h14v5M5 17v4m14-4v4M3 21h4m10 0h4"/><circle cx="12" cy="3" r="2"/><circle cx="5" cy="15" r="2"/><circle cx="19" cy="15" r="2"/>
{% elif name == 'classify' %}<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>
{% endif %}
</svg>
{%- endmacro %}
